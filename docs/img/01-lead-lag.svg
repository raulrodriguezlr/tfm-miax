<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Concepto de lead-lag entre dos activos</title>
<desc>El activo A registra un pico de precio y el activo B repite el mismo movimiento unos minutos despues. La distancia entre ambos picos es el retardo.</desc>
<rect x="60" y="24" width="180" height="28" rx="4" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="74" y="43" font-size="14" font-weight="500" fill="#3C3489">Activo A &#8212; el que lidera</text>
<rect x="300" y="24" width="320" height="28" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="314" y="43" font-size="13" fill="#444441">Retardo: B repite el movimiento minutos despu&#233;s</text>
<polyline points="60,140 100,125 140,138 180,127 220,102 260,110 300,135 340,128 380,142 420,134 460,124 500,132" fill="none" stroke="#7F77DD" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="220" y1="106" x2="220" y2="160" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="270" y1="160" x2="270" y2="188" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="220" cy="102" r="4.5" fill="#7F77DD"/>
<circle cx="270" cy="192" r="4.5" fill="#1D9E75"/>
<line x1="220" y1="160" x2="270" y2="160" stroke="#444441" stroke-width="1.5"/>
<path d="M226 154 L220 160 L226 166" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M264 154 L270 160 L264 166" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="110,230 150,215 190,228 230,217 270,192 310,200 350,225 390,218 430,232 470,224 510,214 550,222" fill="none" stroke="#1D9E75" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="300" y="244" width="210" height="28" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="314" y="263" font-size="14" font-weight="500" fill="#085041">Activo B &#8212; el que va detr&#225;s</text>
</svg>
