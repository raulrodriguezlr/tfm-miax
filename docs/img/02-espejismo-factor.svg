<rect x="40" y="295" width="280" height="48" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="54" y="315" font-size="13" fill="#444441">Todo apunta a BTC. El grafo no dice</text>
<text x="54" y="333" font-size="13" fill="#444441">nada: es el factor com&#250;n disfrazado.</text>
<rect x="360" y="295" width="280" height="48" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="374" y="315" font-size="13" fill="#444441">Emerge estructura real entre activos:</text>
<text x="374" y="333" font-size="13" fill="#444441">qui&#233;n adelanta a qui&#233;n, y con qu&#233; retardo.</text>
