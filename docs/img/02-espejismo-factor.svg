<circle cx="444" cy="257" r="24" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="444" y="262" font-size="11" fill="#3C3489" text-anchor="middle">LINK</text>
<circle cx="556" cy="257" r="24" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
