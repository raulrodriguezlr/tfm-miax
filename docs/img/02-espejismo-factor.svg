<text x="54" y="43" font-size="14" font-weight="500" fill="#712B13">Correlaci&#243;n cruda</text>
<rect x="360" y="24" width="280" height="28" rx="4" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="374" y="43" font-size="14" font-weight="500" fill="#3C3489">Tras residualizar el factor com&#250;n</text>

<line x1="180" y1="109" x2="180" y2="142" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="113" y1="158" x2="144" y2="168" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="138" y1="238" x2="158" y2="211" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="222" y1="238" x2="202" y2="211" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="247" y1="158" x2="216" y2="168" stroke="#D85A30" stroke-width="1.5" marker-end="url(#a)"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="180" cy="180" r="34" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="180" y="185" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">BTC</text>
<circle cx="180" cy="85" r="24" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="180" y="90" font-size="11" fill="#444441" text-anchor="middle">ETH</text>
