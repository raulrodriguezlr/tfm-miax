<svg xmlns="http://www.w3.org/2000/svg" width="680" height="363" viewBox="0 0 680 363" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>El espejismo de factor en criptoactivos</title>
<desc>A la izquierda, la correlacion cruda hace que todos los activos apunten a Bitcoin, un grafo sin informacion. A la derecha, tras eliminar el factor comun, emerge una estructura dirigida entre los propios altcoins.</desc>
