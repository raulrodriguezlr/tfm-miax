<line x1="417" y1="174" x2="435" y2="230" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="583" y1="174" x2="565" y2="230" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>
<circle cx="500" cy="85" r="24" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
