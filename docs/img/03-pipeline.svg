<svg xmlns="http://www.w3.org/2000/svg" width="680" height="598" viewBox="0 0 680 598" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Pipeline metodol&#243;gico del TFM</title>
<desc>Seis etapas encadenadas: ingesta de velas de Binance, retornos logaritmicos, residualizacion del factor comun, construccion del grafo de lead-lag, red neuronal de grafos temporal y contraste final contra el baseline sin grafo. A la derecha, el riesgo principal de cada etapa.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="80" y="40" width="390" height="60" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="96" y="66" font-size="14" font-weight="500" fill="#444441">1. Velas de 1 minuto (API p&#250;blica de Binance)</text>
<text x="96" y="86" font-size="12" fill="#5F5E5A">30&#8211;50 pares l&#237;quidos contra USDT, 2&#8211;3 a&#241;os de hist&#243;rico</text>
<line x1="275" y1="100" x2="275" y2="126" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="80" y="126" width="390" height="60" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="96" y="152" font-size="14" font-weight="500" fill="#444441">2. Retornos logar&#237;tmicos</text>
<text x="96" y="172" font-size="12" fill="#5F5E5A">Panel alineado tiempo &#215; activo, huecos tratados</text>
<line x1="275" y1="186" x2="275" y2="212" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="80" y="212" width="390" height="60" rx="4" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="96" y="238" font-size="14" font-weight="500" fill="#3C3489">3. Residualizar el factor com&#250;n</text>
<text x="96" y="258" font-size="12" fill="#534AB7">Quitar de cada activo lo que ya explica BTC o la 1&#170; PCA</text>
<line x1="470" y1="242" x2="490" y2="242" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="490" y="228" width="150" height="28" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="565" y="246" font-size="12" fill="#712B13" text-anchor="middle">Espejismo de factor</text>
<line x1="275" y1="272" x2="275" y2="298" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="80" y="298" width="390" height="60" rx="4" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="96" y="324" font-size="14" font-weight="500" fill="#3C3489">4. Grafo de lead-lag dirigido</text>
<text x="96" y="344" font-size="12" fill="#534AB7">Qui&#233;n adelanta a qui&#233;n y con qu&#233; retardo (PCMCI + FDR)</text>
<line x1="470" y1="328" x2="490" y2="328" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="490" y="314" width="150" height="28" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="565" y="332" font-size="12" fill="#712B13" text-anchor="middle">Aristas por puro azar</text>
<line x1="275" y1="358" x2="275" y2="384" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="80" y="384" width="390" height="60" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="96" y="410" font-size="14" font-weight="500" fill="#085041">5. Red neuronal temporal sobre el grafo</text>
<text x="96" y="430" font-size="12" fill="#0F6E56">Predice el retorno idiosincr&#225;tico de cada activo en t+1</text>
<line x1="470" y1="414" x2="490" y2="414" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="490" y="400" width="150" height="28" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="565" y="418" font-size="12" fill="#712B13" text-anchor="middle">Fuga de datos</text>
<line x1="275" y1="444" x2="275" y2="470" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="80" y="470" width="390" height="60" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="96" y="496" font-size="14" font-weight="500" fill="#085041">6. &#191;Bate al mismo modelo sin grafo?</text>
<text x="96" y="516" font-size="12" fill="#0F6E56">Validaci&#243;n purgada y Sharpe neto de costes de transacci&#243;n</text>
<line x1="470" y1="500" x2="490" y2="500" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="490" y="486" width="150" height="28" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="565" y="504" font-size="12" fill="#712B13" text-anchor="middle">Los costes se lo comen</text>

<rect x="80" y="548" width="560" height="30" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="96" y="568" font-size="12" fill="#444441">En rojo: los puntos donde el proyecto se puede ir al traste. Ver secci&#243;n &#171;Riesgos&#187;.</text>
</svg>
