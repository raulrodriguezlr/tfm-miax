[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miax"
version = "0.1.0"
description = "Red de lead-lag entre criptoactivos: descubrimiento causal y GNN temporal (TFM MIAX)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Sin dependencias aqui: el entorno se fija en requirements.txt con versiones exactas (D-07, D-08).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Reglas por defecto de ruff mas las que exigen las normas del repo (CLAUDE.md §6):
# ANN = type hints, D = docstrings, NPY = semillas con default_rng, E501 = lineas cortas.
extend-select = ["ANN", "D", "NPY", "E501"]
# Los metodos magicos y __init__ se documentan en la docstring de la clase.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Los notebooks exploran: sin exigir tipos, docstrings ni longitud de linea.
"notebooks/**" = ["ANN", "D", "E501"]
